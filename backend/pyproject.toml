[project]
name = "civicpulse"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "geoalchemy2>=0.20.0",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "types-python-jose>=3.5.0.20260408",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pyrefly]
search-path = ["app"]
infer-return-types = "checked"
