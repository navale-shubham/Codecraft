[project]
name = "civicpulse"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "geoalchemy2>=0.20.0",
    "shapely>=2.1.2",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
    "pwdlib[argon2]>=0.3.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0.0",
    "types-python-jose>=3.5.0.20260408",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pyrefly]
search-path = ["app"]
infer-return-types = "checked"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning"
]
